<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Convite da Isa</title>

  <meta property="og:title" content="🎉 Convite de Aniversário da Isa">
  <meta property="og:description" content="Clique para ver o convite animado!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://offsetgalaxy131.github.io/convite-isa/">
  <meta property="og:image" content="https://offsetgalaxy131.github.io/convite-isa/capa.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:site_name" content="Convite da Isa">

  <meta name="twitter:card" content="summary_large_image">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;

      display:flex;
      justify-content:center;
      align-items:center;

      background:linear-gradient(
  	180deg,
  	#FFF1F8 0%,
  	#FFD9EC 55%,
  	#FFE7B8 100%
	);

      font-family:Arial,sans-serif;

      position:relative;
    }

    /* Brilho atrás do vídeo */

    body::before{

      content:"";

      position:absolute;

      width:80vmin;
      height:80vmin;

      border-radius:50%;

      background:rgba(255,255,255,.55);

      filter:blur(80px);

      z-index:0;

    }

    /* Confetes discretos */

    body::after{

  content:"";

  position:absolute;

  inset:0;

  background-image:

  radial-gradient(circle at 10% 15%, rgba(255,120,170,.45) 6px, transparent 7px),
  radial-gradient(circle at 22% 82%, rgba(255,210,80,.45) 5px, transparent 6px),
  radial-gradient(circle at 35% 28%, rgba(255,255,255,.70) 4px, transparent 5px),
  radial-gradient(circle at 48% 72%, rgba(255,170,210,.45) 6px, transparent 7px),
  radial-gradient(circle at 60% 18%, rgba(255,230,120,.45) 4px, transparent 5px),
  radial-gradient(circle at 72% 55%, rgba(255,255,255,.60) 5px, transparent 6px),
  radial-gradient(circle at 85% 25%, rgba(255,150,190,.45) 5px, transparent 6px),
  radial-gradient(circle at 92% 78%, rgba(255,220,120,.45) 6px, transparent 7px),
  radial-gradient(circle at 15% 55%, rgba(255,255,255,.55) 3px, transparent 4px),
  radial-gradient(circle at 80% 88%, rgba(255,170,220,.40) 4px, transparent 5px);

  opacity:.9;

  z-index:0;

}

    video{

      position:relative;

      z-index:1;

      width:min(100vw,100vh);
      height:min(100vw,100vh);

      object-fit:contain;

      border-radius:28px;

      box-shadow:
        0 18px 60px rgba(0,0,0,.18);

    }

  </style>

</head>

<body>

  <video
    autoplay
    muted
    loop
    playsinline>

    <source src="Convite Isa.mp4" type="video/mp4">

  </video>

</body>
</html>
