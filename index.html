<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Convite da Isa</title>

  <meta property="og:title" content="🎉 Convite de Aniversário da Isa">
  <meta property="og:description" content="Clique para ver o convite animado!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://offsetgalaxy131.github.io/convite-isa/">
  <meta property="og:image" content="https://offsetgalaxy131.github.io/convite-isa/capa.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:site_name" content="Convite da Isa">

  <meta name="twitter:card" content="summary_large_image">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;

      display:flex;
      justify-content:center;
      align-items:center;

      background:linear-gradient(
        180deg,
        #FFF7FB 0%,
        #FFEAF5 100%
      );

      font-family:Arial,sans-serif;

      position:relative;
    }

    /* Brilho atrás do vídeo */

    body::before{

      content:"";

      position:absolute;

      width:80vmin;
      height:80vmin;

      border-radius:50%;

      background:rgba(255,255,255,.55);

      filter:blur(80px);

      z-index:0;

    }

    /* Confetes discretos */

    body::after{

      content:"";

      position:absolute;

      inset:0;

      background-image:

      radial-gradient(circle at 12% 18%, rgba(255,182,193,.20) 3px, transparent 4px),
      radial-gradient(circle at 82% 20%, rgba(255,218,185,.20) 4px, transparent 5px),
      radial-gradient(circle at 25% 75%, rgba(255,255,255,.35) 3px, transparent 4px),
      radial-gradient(circle at 72% 82%, rgba(255,192,203,.20) 3px, transparent 4px),
      radial-gradient(circle at 50% 45%, rgba(255,255,255,.30) 2px, transparent 3px),
      radial-gradient(circle at 92% 65%, rgba(255,182,193,.18) 3px, transparent 4px),
      radial-gradient(circle at 8% 88%, rgba(255,228,196,.20) 4px, transparent 5px);

      opacity:.55;

      z-index:0;

    }

    video{

      position:relative;

      z-index:1;

      width:min(100vw,100vh);
      height:min(100vw,100vh);

      object-fit:contain;

      border-radius:28px;

      box-shadow:
        0 18px 60px rgba(0,0,0,.18);

    }

  </style>

</head>

<body>

  <video
    autoplay
    muted
    loop
    playsinline>

    <source src="Convite Isa.mp4" type="video/mp4">

  </video>

</body>
</html>
